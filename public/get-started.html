<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Get started — Where Are We Moving</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <header>
      <nav>
        <a href="/" class="logo">Where Are We Moving</a>
        <ul>
          <li>
            <a href="/about" data-i18n="nav.about">About</a>
          </li>
          <li>
            <select id="locale-switcher" aria-label="Language">
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </li>
          <li id="nav-auth">
            <a
              href="/get-started"
              class="btn-nav"
              aria-current="page"
              data-i18n="nav.sign_in"
            >Sign in</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="page-centered">
      <div class="card">
        <div class="card-header">
          <h1 data-i18n="get_started.title">Welcome back</h1>
          <p data-i18n="get_started.subtitle">
            Sign in or create an account to get started.
          </p>
        </div>

        <p id="magic-notice" class="notice hidden" aria-live="polite"></p>

        <form
          id="magic-form"
          method="post"
          action="/auth/magic-link"
          novalidate
        >
          <div class="field">
            <label for="email" data-i18n="get_started.email_label"
            >Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="you@example.com"
              data-i18n-placeholder="get_started.email_placeholder"
              required
            >
          </div>
          <button
            type="submit"
            class="btn btn-primary"
            data-i18n="get_started.send_link"
          >
            Send sign-in link
          </button>
        </form>

        <div class="divider">
          <span data-i18n="get_started.or">or</span>
        </div>

        <button
          id="passkey-login"
          class="btn btn-secondary hidden"
          type="button"
          data-i18n="get_started.passkey_btn"
        >
          Sign in with a passkey
        </button>
      </div>
    </div>

    <script type="module" src="/client.js"></script>
  </body>
</html>
