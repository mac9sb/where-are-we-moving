<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link expired — Where Are We Moving</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <header>
      <nav>
        <a href="/" class="logo">Where Are We Moving</a>
        <ul>
          <li>
            <a href="/about" data-i18n="nav.about">About</a>
          </li>
          <li>
            <select id="locale-switcher" aria-label="Language">
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </li>
          <li id="nav-auth">
            <a href="/get-started" class="btn-nav" data-i18n="nav.sign_in"
            >Sign in</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="page-centered">
      <div class="card">
        <div class="card-header">
          <h1 data-i18n="link_expired.title">Link expired</h1>
          <p data-i18n="link_expired.subtitle">
            This sign-in link has already been used or has expired.
          </p>
        </div>
        <a
          href="/get-started"
          class="btn btn-primary"
          data-i18n="link_expired.cta"
        >Try again</a>
      </div>
    </div>

    <script type="module" src="/client.js"></script>
  </body>
</html>
